name: Optimize images

on:
  push:
    branches: [main]
    paths:
      - "assets/**/*.png"
      - "assets/**/*.jpg"
      - "assets/**/*.jpeg"
      - ".github/scripts/optimize-images.mjs"
      - ".github/workflows/optimize-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install image optimizer
        run: npm install --no-save --package-lock=false sharp@0.33.5

      - name: Generate optimized WebP copies
        run: node .github/scripts/optimize-images.mjs

      - name: Update HTML to use available WebP files
        run: node .github/scripts/update-webp-links.mjs

      - name: Commit optimized images and updated links
        run: |
          if [ -z "$(git status --porcelain -- assets '*.html')" ]; then
            echo "No image or HTML changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ':(glob)assets/**/*.webp' ':(glob)**/*.html'

          if git diff --cached --quiet; then
            echo "No optimized image or HTML changes to commit."
            exit 0
          fi

          git commit -m "chore: optimize images and update WebP links [skip ci]"
          git push
