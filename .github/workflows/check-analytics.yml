name: Check analytics

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'assets/js/analytics.js'
      - 'assets/css/analytics.css'
      - 'tests/analytics.mjs'
      - '.github/workflows/check-analytics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check syntax and browser behavior
        run: |
          node --check assets/js/analytics.js
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/analytics-server.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 0.5
          done
          node tests/analytics.mjs
      - name: Save consent screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consent-screenshots
          path: /tmp/consent-*.png
          if-no-files-found: ignore
